<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerZone - Contacto</title>
    <h1>Escríbenos — Versión B</h1>
</head>
<body style="font-family: Arial, sans-serif; background-color: #1a1a2e; color: #e0e0e0; margin: 0; padding: 20px; line-height: 1.6;">

    <!-- Menú de Navegación -->
    <nav style="background-color: #16213e; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 30px;">
        <a href="index.html" style="color: #ffffff; text-decoration: none; margin: 0 15px; font-size: 18px;">Inicio</a> |
        <a href="about.html" style="color: #ffffff; text-decoration: none; margin: 0 15px; font-size: 18px;">Sobre Nosotros</a> |
        <a href="contact.html" style="color: #00fff5; text-decoration: none; font-weight: bold; margin: 0 15px; font-size: 18px;">Contacto</a>
    </nav>

    <!-- Contenido Principal -->
    <main style="max-width: 800px; margin: 0 auto; background-color: #0f3460; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <h1 style="color: #00fff5; text-align: center; margin-top: 0;">Contáctanos ✉️</h1>
        <p style="text-align: center;">¿Tienes alguna pregunta, sugerencia o propuesta de colaboración? ¡Nos encantaría escucharte!</p>
        
        <hr style="border: 1px solid #16213e; margin: 25px 0;">

        <!-- Formulario de Contacto (Simulado) -->
        <form style="display: block;">
            <div style="margin-bottom: 15px;">
                <label for="name" style="display: block; margin-bottom: 5px; font-weight: bold;">Nombre:</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #16213e; background-color: #1a1a2e; color: #ffffff; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="email" style="display: block; margin-bottom: 5px; font-weight: bold;">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #16213e; background-color: #1a1a2e; color: #ffffff; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="message" style="display: block; margin-bottom: 5px; font-weight: bold;">Mensaje:</label>
                <textarea id="message" name="message" rows="5" placeholder="Escribe tu mensaje aquí..." style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #16213e; background-color: #1a1a2e; color: #ffffff; box-sizing: border-box;"></textarea>
            </div>

            <button type="button" style="background-color: #e94560; color: #ffffff; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%;">Enviar Mensaje</button>
        </form>

        <div style="margin-top: 30px; text-align: center;">
            <p>También puedes escribirnos directamente a: <strong style="color: #00fff5;">contacto@gamerzone.com</strong></p>
        </div>
    </main>

    <!-- Pie de página -->
    <footer style="text-align: center; margin-top: 40px; color: #888888; font-size: 14px;">
        <p>&copy; 2026 GamerZone. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
